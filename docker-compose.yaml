# Base config — production-safe.
# Runs the compiled build (production Dockerfile stage), no watch, no debug.
# Local dev extras (watch, debugger, source volumes) live in
# docker-compose.override.yml, which `docker compose up` merges automatically.
# For production, use only this file: `docker compose -f docker-compose.yaml up`.
services:
  reservations:
    build:
      context: .
      dockerfile: ./apps/reservations/Dockerfile
      target: production
    env_file:
      - ./apps/reservations/.env
    ports:
      - '3000:3000'
  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: production
    env_file:
      - ./apps/auth/.env
    ports:
      - '3001:3001'
  payments:
    build:
      context: .
      dockerfile: ./apps/payments/Dockerfile
      target: production
    env_file:
      - ./apps/payments/.env
    ports:
      - '3003:3003'
  mongo:
    image: mongo
